# Default values for todo-app-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

backend:
  image:
    repository: todo-backend
    tag: latest
  service:
    type: ClusterIP
    port: 8000

frontend:
  image:
    repository: todo-frontend
    tag: latest
  service:
    type: LoadBalancer
    port: 3000

secrets:
  databaseUrl: placeholder-database-url
  openaiApiKey: placeholder-openai-key
  kafkaBroker: placeholder-kafka-broker
  kafkaUsername: placeholder-kafka-username
  kafkaPassword: placeholder-kafka-password
