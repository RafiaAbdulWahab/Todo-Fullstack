# Default values for todo-app-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

backend:
  image:
    repository: todo-backend
    tag: latest
  service:
    type: ClusterIP
    port: 8000

frontend:
  image:
    repository: todo-frontend
    tag: latest
  service:
    type: NodePort
    port: 3000
    nodePort: 30080 # This should match the one in k8s/frontend-deployment.yaml

secrets:
  databaseUrl: placeholder-database-url
  openaiApiKey: placeholder-openai-key
