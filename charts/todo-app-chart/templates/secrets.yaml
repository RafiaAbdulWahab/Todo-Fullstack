apiVersion: v1
kind: Secret
metadata:
  name: todo-app-secrets
type: Opaque
data:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | b64enc }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | b64enc }}
  KAFKA_BROKER: {{ .Values.secrets.kafkaBroker | b64enc }}
  KAFKA_USERNAME: {{ .Values.secrets.kafkaUsername | b64enc }}
  KAFKA_PASSWORD: {{ .Values.secrets.kafkaPassword | b64enc }}
